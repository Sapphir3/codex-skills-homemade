name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate nested repository structure
        shell: pwsh
        run: ./tools/Test-SkillRepository.ps1

      - name: Test codex-skill-lifecycle
        shell: pwsh
        run: ./skill-development-tools/codex-skill-lifecycle.tests/Run-Tests.ps1

      - name: Test mineru-api-batch-convert
        shell: pwsh
        run: ./paper-library-skills/mineru-api-batch-convert.tests/Run-Tests.ps1

      - name: Test MinerU credential setup and persistence
        shell: pwsh
        run: ./paper-library-skills/mineru-api-batch-convert.tests/Test-Credentials.ps1

      - name: Test MinerU on Windows PowerShell
        shell: powershell
        run: |
          ./paper-library-skills/mineru-api-batch-convert.tests/Run-Tests.ps1
          ./paper-library-skills/mineru-api-batch-convert.tests/Test-Credentials.ps1

      - name: Install lab-note test dependencies
        shell: pwsh
        run: python -m pip install -r ./lab-workflow-skills/handwritten-labnote-to-markdown.tests/requirements.txt

      - name: Test handwritten-labnote-to-markdown
        shell: pwsh
        run: python -X utf8 -B ./lab-workflow-skills/handwritten-labnote-to-markdown.tests/test_runtime.py
